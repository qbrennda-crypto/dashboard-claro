name: Actualizar Excel desde OneDrive

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  actualizar-excel:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar Excel desde Microsoft Excel Online
        run: |
          curl -L --fail --retry 3 \
            "https://usc-excel.officeapps.live.com/x/_layouts/XlFileHandler.aspx?WacUserType=WOPI&NoAuth=1&usid=200e9c2c-d441-68bb-4edf-7fd9fdb42efe&waccluster=GCL1" \
            -o ventas_claro.xlsx

      - name: Verificar descarga
        run: |
          echo "Tamaño del archivo:"
          ls -lh ventas_claro.xlsx

          if [ ! -s ventas_claro.xlsx ]; then
            echo "ERROR: El archivo descargado está vacío."
            exit 1
          fi

          TIPO=$(file -b ventas_claro.xlsx)
          echo "Tipo detectado: $TIPO"

          if ! unzip -t ventas_claro.xlsx >/dev/null 2>&1; then
            echo "ERROR: Microsoft respondió, pero lo descargado no parece ser un Excel XLSX válido."
            exit 1
          fi

          echo "OK: Se descargó un XLSX válido."

      - name: Guardar fecha y hora de actualización
        run: |
          TZ="America/Lima" date '+%d/%m/%Y · %I:%M %p' > ultima_actualizacion.txt
          cat ultima_actualizacion.txt

      - name: Guardar actualización en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ventas_claro.xlsx ultima_actualizacion.txt

          if git diff --cached --quiet; then
            echo "El Excel no presentó cambios."
          else
            git commit -m "Actualizar Excel automáticamente"
            git push
          fi
